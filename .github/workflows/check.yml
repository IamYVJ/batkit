name: check

on:
  push:
  pull_request:

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails if docs/index.html or the README tables don't match catalog.json and scripts/,
      # or if a script is missing from the catalog.
      - run: node tools/build.mjs --check
